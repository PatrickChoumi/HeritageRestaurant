# PostgreSQL local, pour tester le site dans les conditions de la production :
#   docker compose up -d
#   DATABASE_URL=postgres://heritage:heritage@localhost:5432/heritage npm run db:setup
#   DATABASE_URL=postgres://heritage:heritage@localhost:5432/heritage npm run dev
# (sans Docker, `npm run dev` fonctionne aussi : base PostgreSQL embarquée PGlite)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: heritage
      POSTGRES_PASSWORD: heritage
      POSTGRES_DB: heritage
    ports:
      - '5432:5432'
    volumes:
      - heritage-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U heritage']
      interval: 5s
      retries: 10

  # Le site lui-même (serveur Node), si vous préférez tout lancer avec Docker :
  #   docker compose --profile app up --build
  app:
    profiles: ['app']
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://heritage:heritage@postgres:5432/heritage
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - '3000:3000'

volumes:
  heritage-db:
